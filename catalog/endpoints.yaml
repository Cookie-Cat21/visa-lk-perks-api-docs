title: Visa LK Perks API
host: https://www.visa.com.lk
tier: A
category: cards
probe_delay_seconds: 1.0
ethics: See docs/ETHICS.md
source_docs_in_lankawa:
- docs/BANK_API_DEEP_DIVE_VISA_SC_FDRATES.md
endpoints:
- id: portal_perks
  method: POST
  url: https://www.visa.com.lk/offers/api/portal/portal/perks/
  path: /offers/api/portal/portal/perks/
  summary: VMORC perks. Body must include siteId + a populated perkTypeRequests array (one entry per perk type); the old siteId+pageRequest-only body fails with 400/500. Fixed and verified 2026-09-14 via network capture + JS bundle inspection of visa.com.lk/en_lk/visa-offers-and-perks/ (public page, no auth) — confirmed 200 with no cookies via plain curl, so this is a genuinely stateless public endpoint.
  pagination:
    style: pageRequest
    params:
      pageRequest.index: 0-based (per perkTypeRequests entry)
      pageRequest.limit: page size (per perkTypeRequests entry)
    lab: false
  headers:
    Content-Type: application/json
  body_json:
    siteId: www.visa.com.lk
    perkTypeRequests:
      - requestIdentifier: null
        perkType: OFFERS
        locale: en_lk
        pageRequest:
          index: 0
          limit: 20
      - requestIdentifier: null
        perkType: PROMOTIONS
        locale: en_lk
        pageRequest:
          index: 0
          limit: 20
      - requestIdentifier: null
        perkType: BENEFITS
        locale: en_lk
  access: json_api
